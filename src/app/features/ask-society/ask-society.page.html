<ion-header class="ask-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" aria-label="Back" (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <h1 class="ask-title">{{ pageTitle() }}</h1>

    <ion-buttons slot="end">
      <ion-button fill="clear" class="guidelines-btn" (click)="showGuidelines()">
        <ion-icon slot="start" name="information-circle-outline"></ion-icon>
        Guidelines
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ask-content">
  <form class="ask-wrap" [formGroup]="form" (ngSubmit)="submit()">
    <div class="ask-author">
      <div class="ask-avatar" aria-hidden="true">{{ initials }}</div>
      <div class="ask-author-meta">
        <p class="ask-name">{{ fullName || 'Resident' }}</p>
        <p class="ask-flat">{{ flatLabel }}</p>
      </div>

      <ion-select
        class="ask-audience"
        interface="popover"
        [interfaceOptions]="audiencePopoverOptions"
        formControlName="visibility"
        aria-label="Audience"
        toggleIcon="chevron-down-outline"
      >
        <ion-select-option value="ALL_RESIDENTS">All Residents</ion-select-option>
        <ion-select-option value="OWNERS">Owners</ion-select-option>
        <ion-select-option value="TENANTS">Tenants</ion-select-option>
      </ion-select>
    </div>

    <ion-textarea
      class="ask-textarea"
      formControlName="body"
      autoGrow="true"
      rows="6"
      placeholder="What do you want to talk about?"
      (ionBlur)="form.controls.body.markAsTouched(); formTick.update((n) => n + 1)"
    ></ion-textarea>

    @if (bodyError()) {
      <p class="field-error ask-field-error">{{ bodyError() }}</p>
    }

    @if (error()) {
      <ion-text color="danger">
        <p class="error">{{ error() }}</p>
      </ion-text>
    }
  </form>
</ion-content>

<div class="ask-toolbar">
  <div class="ask-media">
    <ion-button fill="clear" disabled aria-label="Photo">
      <ion-icon slot="icon-only" name="image-outline"></ion-icon>
    </ion-button>
    <ion-button fill="clear" disabled aria-label="Camera">
      <ion-icon slot="icon-only" name="camera-outline"></ion-icon>
    </ion-button>
    <ion-button fill="clear" disabled aria-label="Attach">
      <ion-icon slot="icon-only" name="attach-outline"></ion-icon>
    </ion-button>
  </div>

  <ion-button
    class="ask-post-btn"
    [disabled]="!canPost()"
    (click)="submit()"
  >
    @if (loading()) {
      <ion-spinner name="crescent"></ion-spinner>
    } @else {
      <ion-icon slot="start" name="send-outline"></ion-icon>
      {{ postButtonLabel() }}
    }
  </ion-button>
</div>
