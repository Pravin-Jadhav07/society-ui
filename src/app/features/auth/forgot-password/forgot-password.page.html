<ion-content class="login-content">
  <div class="login-wrap">
    <h1 class="brand">Society</h1>
    <p class="subtitle">Reset your password</p>

    @if (success()) {
      <ion-text color="primary">
        <p class="success">{{ success() }}</p>
      </ion-text>
      <ion-button expand="block" fill="outline" routerLink="/login">Back to sign in</ion-button>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <ion-list lines="full" class="login-list">
          <ion-item>
            <ion-input
              label="Email"
              labelPlacement="stacked"
              type="email"
              formControlName="email"
              autocomplete="email"
              (ionBlur)="touch()"
            ></ion-input>
          </ion-item>
          @if (emailError()) {
            <ion-note color="danger" class="field-error">{{ emailError() }}</ion-note>
          }
        </ion-list>

        @if (error()) {
          <ion-text color="danger">
            <p class="error">{{ error() }}</p>
          </ion-text>
        }

        <ion-button expand="block" type="submit" [disabled]="loading()">
          @if (loading()) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Send reset link
          }
        </ion-button>
      </form>
    }

    <p class="register-hint">
      <a routerLink="/login">Back to sign in</a>
    </p>
  </div>
</ion-content>
