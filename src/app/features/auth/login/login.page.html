<ion-content class="login-content">
  <div class="login-wrap">
    <h1 class="brand">Society</h1>
    <p class="subtitle">Sign in to continue</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <ion-list lines="full" class="login-list">
        <ion-item>
          <ion-input
            label="Mobile"
            labelPlacement="stacked"
            type="tel"
            inputmode="numeric"
            maxlength="10"
            formControlName="username"
            autocomplete="username"
            (ionBlur)="touch('username')"
          ></ion-input>
        </ion-item>
        @if (mobileError()) {
          <ion-note color="danger" class="field-error">{{ mobileError() }}</ion-note>
        }

        <ion-item>
          <ion-input
            label="Password"
            labelPlacement="stacked"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            (ionBlur)="touch('password')"
          ></ion-input>
        </ion-item>
        @if (passwordError()) {
          <ion-note color="danger" class="field-error">{{ passwordError() }}</ion-note>
        }
      </ion-list>

      <p class="forgot-link">
        <a routerLink="/forgot-password">Forgot password?</a>
      </p>

      @if (error()) {
        <ion-text color="danger">
          <p class="error">{{ error() }}</p>
        </ion-text>
      }

      <ion-button expand="block" type="submit" [disabled]="loading()">
        @if (loading()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Sign in
        }
      </ion-button>
    </form>

    <p class="register-hint">
      New here?
      <a routerLink="/register">Register</a>
    </p>
  </div>
</ion-content>
