<app-header
  [flatLabel]="flatLabel"
  [subtitle]="societyName"
  (profileClick)="openProfile()"
></app-header>

<ion-content class="page-content">
  <div class="page-wrap">
    <ion-text>
      <h1>Community</h1>
      <p>Static structure — notices and actions will come here.</p>
    </ion-text>

    <div class="placeholder-list">
      @for (item of placeholders; track item.label) {
        <button type="button" class="placeholder-row" disabled>
          <ion-icon [name]="item.icon"></ion-icon>
          <span>{{ item.label }}</span>
        </button>
      }
    </div>
  </div>
</ion-content>
