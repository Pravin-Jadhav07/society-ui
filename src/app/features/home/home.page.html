<ion-content class="ion-padding">
  <ion-text>
    <h1>Welcome to {{ societyName }}</h1>
    @if (fullName) {
      <p>Hi, {{ fullName }}</p>
    }
    @if (role) {
      <p>Role: {{ role }}</p>
    }
  </ion-text>
  <ion-button expand="block" fill="outline" [disabled]="loggingOut()" (click)="logout()">
    @if (loggingOut()) {
      <ion-spinner name="crescent"></ion-spinner>
    } @else {
      Sign out
    }
  </ion-button>
</ion-content>
